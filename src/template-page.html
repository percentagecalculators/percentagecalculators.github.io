<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>{{THEME_INIT}}</script>
    <link rel="stylesheet" href="/tailwind.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta name="author" content="{{SITE_NAME}}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <title>{{META_TITLE}}</title>

    <link rel="preload" href="/fonts/dm-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono-variable.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="icon" href="/favicon.ico">
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)">

    <link rel="preload" href="/base.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/base.min.css"></noscript>

    <!-- Non-blocking, same preload+onload swap as base.min.css above: the math
         KaTeX renders is below the fold and only applied on DOMContentLoaded
         (see renderMath() below), so nothing needs this stylesheet to be
         render-blocking. -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"></noscript>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0ZHGJTMNYK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0ZHGJTMNYK');
    </script>
</head>
{{SITE_HEADER}}
{{MOBILE_DRAWER}}

<main id="main-content">
    {{BREADCRUMBS}}
    <section class="mx-auto max-w-7xl px-4 pb-2 pt-10 text-center sm:px-6">
        <h1 class="text-[clamp(1.6rem,4.5vw,2.35rem)] font-bold leading-tight text-text">{{H1}}</h1>
        <p class="subtitle mt-3 text-base leading-relaxed text-text-secondary">{{SUBTITLE}}</p>
    </section>

    <section class="block py-10 sm:py-14">
        <div class="block-inner mx-auto max-w-7xl px-4 sm:px-6">
            <div class="content-card rounded-2xl border border-border bg-surface p-6 sm:p-8">
                <div class="{{ARTICLE_PROSE_CLASSES}}">
                    {{PAGE_CONTENT}}
                </div>
            </div>
        </div>
    </section>
</main>

{{SITE_FOOTER}}

<script>
{{NAV_JS_CORE}}
  function wrapTables() {
    document.querySelectorAll('.article table').forEach(function (table) {
      if (table.closest('.table-scroll')) return;
      var wrap = document.createElement('div');
      wrap.className = 'table-scroll overflow-x-auto';
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
  }
  function renderMath() {
    if (typeof renderMathInElement === 'undefined') return;
    document.querySelectorAll('.article').forEach(function (el) {
      renderMathInElement(el, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false
      });
    });
  }
  document.addEventListener('DOMContentLoaded', function () {
    initThemeToggle();
    var closeAll = initCategoryDropdowns();
    initPriorityNav(closeAll);
    initMobileDrawer();
    wrapTables();
    renderMath();
  });
</script>
</body>
</html>
