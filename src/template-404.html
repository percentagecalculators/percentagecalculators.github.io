<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>{{THEME_INIT}}</script>
    <link rel="stylesheet" href="/tailwind.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found | {{SITE_NAME}}</title>

    <link rel="preload" href="/fonts/dm-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono-variable.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="icon" href="/favicon.ico">
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)">

    <link rel="preload" href="/base.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/base.min.css"></noscript>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0ZHGJTMNYK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0ZHGJTMNYK');
    </script>
</head>
{{SITE_HEADER}}
{{MOBILE_DRAWER}}

<main id="main-content">
    <section class="error-hero mx-auto max-w-2xl px-4 py-16 text-center sm:px-6 sm:py-24">
        <div class="error-code font-mono text-[clamp(4rem,18vw,7rem)] font-bold leading-none text-accent" aria-hidden="true">404</div>
        <h1 class="mt-2 text-2xl font-bold text-text sm:text-3xl">Page Not Found</h1>
        <p class="subtitle mx-auto mt-3 max-w-md text-base text-text-secondary">The page you're looking for doesn't exist, may have been renamed, or the link is out of date.</p>
        <div class="error-actions mt-8 flex flex-wrap items-center justify-center gap-3">
            <a href="/" class="btn-primary rounded-lg bg-accent px-5 py-2.5 text-sm font-semibold text-white hover:bg-accent-dark">Back to Home</a>
            <a href="/#all-tools" class="btn-secondary rounded-lg border border-border px-5 py-2.5 text-sm font-semibold text-text hover:bg-surface-alt">Browse All Tools</a>
        </div>
    </section>
</main>

{{SITE_FOOTER}}

<script>
{{NAV_JS_CORE}}
  document.addEventListener('DOMContentLoaded', function () {
    initThemeToggle();
    var closeAll = initCategoryDropdowns();
    initPriorityNav(closeAll);
    initMobileDrawer();
  });
</script>
</body>
</html>
