<!DOCTYPE html>
<html {{HTML_ATTRS}}>
<head>
    <meta charset="UTF-8">
    <script>{{THEME_INIT}}</script>
    <link rel="stylesheet" href="/tailwind.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta name="author" content="{{SITE_NAME}}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    {{HREFLANG_LINKS}}
    <title>{{META_TITLE}}</title>

    <link rel="preload" href="/fonts/dm-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono-variable.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="icon" href="/favicon.ico">
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)">

    <link rel="preload" href="/base.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/base.min.css"></noscript>

    <!-- Non-blocking, same preload+onload swap as base.min.css above: the math
         KaTeX renders is below the fold and only applied on DOMContentLoaded
         (see renderMath() below), so nothing needs this stylesheet to be
         render-blocking. -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"></noscript>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <script type="application/ld+json">{{WEBAPP_JSONLD}}</script>
    {{WEBSITE_JSONLD}}
    {{FAQ_JSONLD}}

    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
    {{ADSENSE_LOADER}}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0ZHGJTMNYK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0ZHGJTMNYK');
    </script>
</head>
{{SITE_HEADER}}
{{MOBILE_DRAWER}}

<main id="main-content" data-copy-label="{{COPY_LABEL}}" data-copied-label="{{COPIED_LABEL}}">
    {{BREADCRUMBS}}

    <section id="calculator" class="mx-auto max-w-7xl px-4 pb-4 pt-6 sm:px-6 sm:pt-8">
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-[minmax(0,1.6fr)_minmax(0,1fr)]">
            <div class="tool-section lg:col-start-1 lg:row-start-1">
                <form class="h-full" aria-labelledby="tool-title" data-mode="{{TOOL_MODE}}" data-layout="{{TOOL_LAYOUT}}"{{TOOL_DATA_ATTRS}} novalidate>
                    {{TOOL_CARD_BODY}}
                </form>
                {{TOOL_WARNING}}
                {{CODE_SNIPPET}}
            </div>
            <!-- DOM order (tool card, ad, related grid) is what mobile actually
                 renders -- grid-cols-1 below lg stacks items in source order
                 with no grid-column/row overrides, so the ad naturally lands
                 between the tool card and the related-tools grid instead of
                 being pushed below every stacked related card. On lg+, the
                 explicit col/row-start placement below restores the original
                 2-column layout with the ad full-width beneath both. -->
            <div class="lg:col-span-2 lg:col-start-1 lg:row-start-2">{{ADSENSE_HEADER}}</div>
            <aside class="related-tools grid grid-cols-1 gap-3 sm:grid-cols-2 lg:col-start-2 lg:row-start-1{{ASIDE_SELF_START}}" aria-label="{{UI_RELATED_ARIA}}">{{RELATED_CALCULATORS}}</aside>
        </div>
    </section>

{{MAIN_SECTIONS}}

</main>

{{SITE_FOOTER}}

{{TOOL_EXTRA_SCRIPTS}}
<script>{{TOOL_SCRIPT}}</script>
<script defer src="/site.min.js?v={{SITE_JS_VERSION}}"></script>
</body>
</html>
