<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="pfTitle pfDesc">
  <title id="pfTitle">The percentage formula</title>
  <desc id="pfDesc">Whole multiplied by Percent (as a decimal) equals Part. Rearranged: Whole equals Part divided by Percent, and Percent equals Part divided by Whole.</desc>
  <rect x="1" y="1" width="558" height="258" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="280" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The Percentage Formula</text>

  <!-- WHOLE box -->
  <rect x="30" y="75" width="130" height="64" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="95" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#065f46">WHOLE</text>

  <text x="182" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155">×</text>

  <!-- PERCENT box -->
  <rect x="205" y="75" width="150" height="64" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="280" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#065f46">PERCENT</text>
  <text x="280" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#047857">(as a decimal)</text>

  <text x="387" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155">=</text>

  <!-- PART box -->
  <rect x="410" y="75" width="120" height="64" rx="12" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="470" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">PART</text>

  <line x1="40" y1="175" x2="520" y2="175" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="280" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#334155">Part = Whole × Percent&#160;&#160;&#160;&#160;|&#160;&#160;&#160;&#160;Whole = Part ÷ Percent&#160;&#160;&#160;&#160;|&#160;&#160;&#160;&#160;Percent = Part ÷ Whole</text>
  <text x="280" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#64748b">Example: 12 is what percent of 60? Percent = 12 ÷ 60 = 0.2 = 20%</text>
</svg>
